name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: node tools/test_calc_engine.js
      - name: Fetch KaTeX
        run: python tools/fetch_katex.py
      - run: node tools/test_notes.js
      - name: Build static preview
        run: python tools/build_preview.py
      - name: Local API smoke test
        run: |
          python web/app.py 8124 &
          sleep 3
          curl -sS -X POST http://127.0.0.1:8124/api/compute \
            -H 'Content-Type: application/json' \
            -d '{"op":"derivative","expr":"x^2*sin(x)","order":1}' | grep -q '"ok": true'
